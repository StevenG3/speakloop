name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: speakloop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: speakloop
      - run: pnpm lint
        working-directory: speakloop
      - run: pnpm typecheck
        working-directory: speakloop
      - run: pnpm test
        working-directory: speakloop
      - run: pnpm test:e2e
        working-directory: speakloop
      - run: pnpm build
        working-directory: speakloop
