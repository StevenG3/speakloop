name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git init
        working-directory: .
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
        working-directory: .
      - run: pnpm typecheck
        working-directory: .
      - run: pnpm test
        working-directory: .
      - run: pnpm --filter @speakloop/web exec playwright install --with-deps
        working-directory: .
      - run: pnpm test:e2e
        working-directory: .
      - run: pnpm build
        working-directory: .
